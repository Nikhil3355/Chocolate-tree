<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Portal - Chocolate Tree Cake Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">

  <!-- Standalone jsPDF for client-side invoice generation on demand -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- PIN AUTH SCREEN -->
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-box">
      <div class="pin-avatar">CT</div>
      <div class="pin-title">Owner Access</div>
      <div class="pin-desc">Enter 4-digit security PIN for Chocolate Tree</div>

      <div class="pin-dots">
        <div class="pin-dot" id="dot0"></div>
        <div class="pin-dot" id="dot1"></div>
        <div class="pin-dot" id="dot2"></div>
        <div class="pin-dot" id="dot3"></div>
      </div>

      <div class="pin-error-text" id="pinError"></div>

      <div class="keypad-grid">
        <button class="key-btn" onclick="enterPinDigit('1')">1</button>
        <button class="key-btn" onclick="enterPinDigit('2')">2</button>
        <button class="key-btn" onclick="enterPinDigit('3')">3</button>
        <button class="key-btn" onclick="enterPinDigit('4')">4</button>
        <button class="key-btn" onclick="enterPinDigit('5')">5</button>
        <button class="key-btn" onclick="enterPinDigit('6')">6</button>
        <button class="key-btn" onclick="enterPinDigit('7')">7</button>
        <button class="key-btn" onclick="enterPinDigit('8')">8</button>
        <button class="key-btn" onclick="enterPinDigit('9')">9</button>
        <button class="key-btn action" onclick="clearPin()">Clear</button>
        <button class="key-btn" onclick="enterPinDigit('0')">0</button>
        <button class="key-btn action" onclick="backspacePin()">⌫</button>
      </div>
    </div>
  </div>

  <!-- MAIN ADMIN APP -->
  <div class="admin-wrapper" id="adminApp" style="display: none;">

    <header class="app-bar">
      <div class="app-brand">
        <div class="brand-avatar">CT</div>
        <div>
          <div class="brand-title">Chocolate Tree</div>
          <div class="brand-sub">Shopkeeper Portal</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logoutAdmin()">
        <span>🔒</span>
        <span>Lock</span>
      </button>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" id="tabBtnOrders" onclick="switchTab('orders')">
        <span>📦 Orders Feed</span>
        <span class="tab-badge" id="ordersCountBadge">0</span>
      </button>
      <button class="tab-btn" id="tabBtnMenu" onclick="switchTab('menu')">
        <span>🎂 Menu &amp; Prices</span>
      </button>
    </nav>

    <!-- TAB 1: ORDERS FEED -->
    <main class="tab-view active" id="viewOrders">
      <section class="metrics-grid">
        <div class="metric-card">
          <div class="metric-num" id="metricTotal">0</div>
          <div class="metric-label">Total</div>
        </div>
        <div class="metric-card">
          <div class="metric-num orange" id="metricPending">0</div>
          <div class="metric-label">Pending</div>
        </div>
        <div class="metric-card">
          <div class="metric-num green" id="metricDelivered">0</div>
          <div class="metric-label">Done</div>
        </div>
        <div class="metric-card">
          <div class="metric-num" id="metricRevenue">₹0</div>
          <div class="metric-label">Sales</div>
        </div>
      </section>

      <section class="search-filter-wrap">
        <input 
          type="search" 
          id="orderSearchInput" 
          placeholder="🔍 Search name, phone, order ID..." 
          class="search-bar" 
          oninput="applyOrderFilters()"
        />
        <div class="chip-group">
          <button class="chip-btn active" onclick="setFilterStatus('all', this)">All Orders</button>
          <button class="chip-btn" onclick="setFilterStatus('Pending', this)">Pending</button>
          <button class="chip-btn" onclick="setFilterStatus('Confirmed', this)">Confirmed</button>
          <button class="chip-btn" onclick="setFilterStatus('Delivered', this)">Delivered</button>
          <button class="chip-btn" onclick="refreshOrdersFeed()">🔄 Refresh</button>
        </div>
      </section>

      <div id="ordersContainer">
        <div class="loader-wrap">
          <div class="spinner"></div>
          <div>Loading orders from Google Sheet...</div>
        </div>
      </div>
    </main>

    <!-- TAB 2: MENU & PRICE EDITOR -->
    <main class="tab-view" id="viewMenu">
      <div style="font-size: 12px; color: #794d35; font-weight: 600;">
        ✏️ Edit cake prices and stock availability below. Changes reflect instantly on customer ordering link.
      </div>

      <div id="catalogEditorContainer">
        <div class="loader-wrap">
          <div class="spinner"></div>
          <div>Loading live menu catalog...</div>
        </div>
      </div>

      <div class="sticky-save-bar">
        <button class="btn-save-catalog" id="btnSaveCatalog" onclick="saveCatalogChanges()">
          <span>💾 SAVE MENU &amp; PRICES</span>
        </button>
      </div>
    </main>

  </div>

  <!-- Scripts in dependency order -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
